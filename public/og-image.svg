<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1f36"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#243b53" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Gradient orb -->
  <circle cx="900" cy="315" r="300" fill="#2a9d8f" opacity="0.1"/>
  
  <!-- Logo mark -->
  <g transform="translate(100, 220)">
    <rect width="64" height="64" rx="16" fill="#2a9d8f"/>
    <text x="18" y="46" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="white">AG</text>
  </g>
  
  <!-- Title -->
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="white">The Authorization</text>
  <text x="100" y="440" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#2a9d8f">Gap</text>
  
  <!-- Subtitle -->
  <text x="100" y="520" font-family="system-ui, sans-serif" font-size="28" fill="#9fb3c8">Beyond SSO: Understanding the gap between identity and access control</text>
  
  <!-- PlainID attribution -->
  <text x="100" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#627d98">Brought to you by PlainID</text>
</svg>
